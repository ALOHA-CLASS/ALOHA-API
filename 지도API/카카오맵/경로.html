<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경로</title>

    <style>
        .container { max-width: 100%; width: 1000px; margin: 0 auto; }
        #map { width: 100%; height: 600px; }
        #result { margin: 10px 0; padding: 10px; background: #f4f4f4; }
    </style>

    <script src="kakao-loader.js"></script>
</head>

<body>

  <div class="container">
    <h1>경로</h1>
    <div id="result"></div>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 5
      });

      // 서울역 → 서울시청 → 경복궁 순서로 좌표를 연결한 선
      const path = [
          new kakao.maps.LatLng(37.5547, 126.9707),
          new kakao.maps.LatLng(37.5600, 126.9750),
          new kakao.maps.LatLng(37.5665, 126.9780),
          new kakao.maps.LatLng(37.5740, 126.9770),
          new kakao.maps.LatLng(37.5796, 126.9770)
      ];

      const polyline = new kakao.maps.Polyline({
          map: map,
          path: path,
          strokeWeight: 5,
          strokeColor: '#FF3B30',
          strokeOpacity: 0.8,
          strokeStyle: 'solid'
      });

      new kakao.maps.CustomOverlay({
          map: map,
          position: path[0],
          content: '<div style="padding:2px 6px;background:#2d6cdf;color:#fff;border-radius:4px;font-size:12px;">출발</div>',
          yAnchor: 2.2
      });
      new kakao.maps.CustomOverlay({
          map: map,
          position: path[path.length - 1],
          content: '<div style="padding:2px 6px;background:#e5342a;color:#fff;border-radius:4px;font-size:12px;">도착</div>',
          yAnchor: 2.2
      });

      const distance = Math.round(polyline.getLength());
      document.getElementById('result').textContent = '총 거리: 약 ' + distance.toLocaleString() + ' m';

      const bounds = new kakao.maps.LatLngBounds();
      path.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds);
    });
  </script>

</body>
</html>
