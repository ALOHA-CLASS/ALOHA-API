<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>좌표찾기</title>

    <style>
        .container { max-width: 100%; width: 1000px; margin: 0 auto; }
        #map { width: 100%; height: 600px; }
        #result { margin: 10px 0; padding: 10px; background: #f4f4f4; }
    </style>

    <script src="kakao-loader.js"></script>
</head>

<body>

  <div class="container">
    <h1>좌표찾기</h1>
    <p>지도를 클릭하면 해당 위치의 좌표가 표시됩니다.</p>
    <div id="result">클릭한 위치의 좌표가 여기에 표시됩니다.</div>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const container = document.getElementById('map');
      const result = document.getElementById('result');

      const map = new kakao.maps.Map(container, {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 3
      });

      const marker = new kakao.maps.Marker();

      kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
          const latlng = mouseEvent.latLng;

          marker.setPosition(latlng);
          marker.setMap(map);

          result.textContent = '위도: ' + latlng.getLat() + ' / 경도: ' + latlng.getLng();
      });
    });
  </script>

</body>
</html>
