<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마커 클릭 이벤트</title>

    <style>
        .container { max-width: 100%; width: 1000px; margin: 0 auto; }
        #map { width: 100%; height: 600px; }
        .info { padding: 8px 12px; font-size: 14px; white-space: nowrap; }
    </style>

    <script src="kakao-loader.js"></script>
</head>

<body>

  <div class="container">
    <h1>마커 클릭 이벤트</h1>
    <p>마커를 클릭하면 인포윈도우가 열리고, 지도를 클릭하면 닫힙니다.</p>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const container = document.getElementById('map');

      const map = new kakao.maps.Map(container, {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 3
      });

      const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(37.5665, 126.9780),
          map: map
      });

      const infowindow = new kakao.maps.InfoWindow({
          content: '<div class="info">서울특별시청</div>',
          removable: true
      });

      kakao.maps.event.addListener(marker, 'click', function () {
          infowindow.open(map, marker);
      });

      kakao.maps.event.addListener(map, 'click', function () {
          infowindow.close();
      });
    });
  </script>

</body>
</html>
