<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>여러 장소 마커 표시</title>

    <style>
        .container { max-width: 100%; width: 1000px; margin: 0 auto; }
        #map { width: 100%; height: 600px; }
        .info { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
    </style>

    <script src="kakao-loader.js"></script>
</head>

<body>

  <div class="container">
    <h1>여러 장소 마커 표시</h1>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 5
      });

      const places = [
          { name: '서울특별시청', lat: 37.5665, lng: 126.9780 },
          { name: '경복궁', lat: 37.5796, lng: 126.9770 },
          { name: '덕수궁', lat: 37.5658, lng: 126.9751 },
          { name: '남산서울타워', lat: 37.5512, lng: 126.9882 },
          { name: '동대문디자인플라자', lat: 37.5671, lng: 127.0092 },
          { name: '서울역', lat: 37.5547, lng: 126.9707 }
      ];

      const infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
          const position = new kakao.maps.LatLng(place.lat, place.lng);
          const marker = new kakao.maps.Marker({ position: position, map: map, title: place.name });

          kakao.maps.event.addListener(marker, 'click', function () {
              infowindow.setContent('<div class="info">' + place.name + '</div>');
              infowindow.open(map, marker);
          });

          bounds.extend(position);
      });

      map.setBounds(bounds);
    });
  </script>

</body>
</html>
