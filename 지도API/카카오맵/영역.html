<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영역</title>

    <style>
        .container { max-width: 100%; width: 1000px; margin: 0 auto; }
        #map { width: 100%; height: 600px; }
        #result { margin: 10px 0; padding: 10px; background: #f4f4f4; }
    </style>

    <script src="kakao-loader.js"></script>
</head>

<body>

  <div class="container">
    <h1>영역</h1>
    <div id="result">영역 위에 마우스를 올려 보세요.</div>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 4
      });

      const path = [
          new kakao.maps.LatLng(37.5700, 126.9730),
          new kakao.maps.LatLng(37.5700, 126.9830),
          new kakao.maps.LatLng(37.5640, 126.9850),
          new kakao.maps.LatLng(37.5620, 126.9780),
          new kakao.maps.LatLng(37.5640, 126.9720)
      ];

      const polygon = new kakao.maps.Polygon({
          map: map,
          path: path,
          strokeWeight: 3,
          strokeColor: '#39DE2A',
          strokeOpacity: 0.8,
          fillColor: '#A2FF99',
          fillOpacity: 0.5
      });

      const result = document.getElementById('result');

      kakao.maps.event.addListener(polygon, 'mouseover', function () {
          polygon.setOptions({ fillColor: '#09F', fillOpacity: 0.6 });
      });
      kakao.maps.event.addListener(polygon, 'mouseout', function () {
          polygon.setOptions({ fillColor: '#A2FF99', fillOpacity: 0.5 });
      });
      kakao.maps.event.addListener(polygon, 'click', function () {
          result.textContent = '면적: 약 ' + Math.round(polygon.getArea()).toLocaleString() + ' ㎡';
      });
    });
  </script>

</body>
</html>
