<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오맵</title>

    <style>
        .container {
          max-width: 100%;
          width: 1000px;
          margin: 0 auto;
        }
        #map {
            width: 100%;
            height: 600px;
        }
    </style>

    <script
        type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=JavaScript키">
    </script>
</head>

<body>

  <div class="container">
    <h1>카카오맵</h1>
    <div id="map"></div>
  </div>

  <script>
    loadKakao().then(function () {
      const container = document.getElementById('map');

      const options = {
          center: new kakao.maps.LatLng(37.5665, 126.9780),
          level: 3
      };

      const map = new kakao.maps.Map(container, options);
    });
  </script>

</body>
</html>
