<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>CartItem Fetch 비동기 연습</title>
</head>
<body>
    <h1>장바구니 REST API - Fetch(AJAX) 실습</h1>
    <!-- ============================= -->
    <!-- 장바구니 목록 조회 -->
    <!-- ============================= -->
    <section>
      <h2>장바구니 목록 조회</h2>
      <input type="text" id="listUserNo" placeholder="회원번호" th:value="${#authentication.principal.user.no}">
      <button onclick="list()">
        장바구니 목록
      </button>
  </section>
    <!-- ============================= -->
    <!-- 장바구니 상세 조회 -->
    <!-- ============================= -->
    <section>
      <h2>장바구니 상세 조회</h2>
      <input type="text" id="cartId" placeholder="장바구니ID">
      <button onclick="get()">
        장바구니 조회
      </button>
  </section>
    <!-- ============================= -->
    <!-- 장바구니 등록 -->
    <!-- ============================= -->
    <section>
      <h2>장바구니 등록</h2>
      <input type="text" id="createUserNo" placeholder="회원번호" th:value="${#authentication.principal.user.no}">
      <br>
      <input type="text" id="createProductNo" placeholder="상품번호">
      <br>
      <input type="text" id="createQuantity" placeholder="수량">
      <br>
      <button onclick="create()">
        장바구니 등록
      </button>
  </section>
    <!-- ============================= -->
    <!-- 장바구니 수정 -->
    <!-- ============================= -->
    <section>
      <h2>장바구니 수정</h2>
      <input type="text" id="updateId" placeholder="장바구니ID">
      <br>
      <input type="text" id="updateQuantity" placeholder="수량">
      <br>
      <button onclick="update()">
        장바구니 수정
      </button>
  </section>
    <!-- ============================= -->
    <!-- 장바구니 삭제 -->
    <!-- ============================= -->
    <section>
      <h2>장바구니 삭제</h2>
      <input type="text" id="deleteId" placeholder="장바구니ID">
      <button onclick="remove()">
        장바구니 삭제
      </button>
  </section>
    <!-- ============================= -->
    <!-- 응답 결과 -->
    <!-- ============================= -->
    <section>
      <h2>응답 결과</h2>
      <pre id="result">
  여기에 서버 응답 출력!
      </pre>
  </section>
    <!-- ============================= -->
    <!-- JS -->
    <!-- ============================= -->
    <script>
    // ==========================================
    // CSRF 토큰
    // ==========================================
    const csrfToken = document.querySelector('meta[name="_csrf"]').content
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content
    // ==========================================
    // 결과 출력
    // ==========================================
    function printResult(data) {
      const $result = document.querySelector("#result")
      // JSON.stringify(
      //   값,
      //   변환할 데이터 선택,
      //   들여쓰기 칸수
      // )
      //
      // JS 객체 ➡ JSON 문자열
      $result.textContent =
        JSON.stringify(data, null, 2)
    }
    // ==========================================
    // 장바구니 목록 조회
    // GET /api/cart
    // ==========================================
    function list() {
      const userNo = document.getElementById("listUserNo").value
      // const url = `/api/cart?userNo=${userNo}`
      const url = `/api/cart`
      // GET 요청
      fetch(url)
        .then(response => response.json())
        .then(data => {
          console.log(data)
          printResult(data)
        })
        .catch(error => {
          console.error(error)
        })
    }
    // ==========================================
    // 장바구니 상세 조회
    // GET /api/cart/{id}
    // ==========================================
    function get() {
      const id = document.getElementById("cartId").value
      fetch(`/api/cart/${id}`)
        .then(response => response.json())
        .then(data => {
          console.log(data)
          printResult(data)
        })
        .catch(error => {
          console.error(error)
        })
    }
    // ==========================================
    // 장바구니 등록
    // POST /api/cart
    // ==========================================
    function create() {
      const userNo = document.getElementById("createUserNo").value
      const productNo = document.getElementById("createProductNo").value
      const quantity = document.getElementById("createQuantity").value
      // 서버로 전송할 데이터
      const data = {
        user: {
          no: Number(userNo)
        },
        product: {
          no: Number(productNo)
        },
        quantity: Number(quantity)
      }
      // POST 옵션
      const option = {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          [csrfHeader]: csrfToken
        },
        // JS 객체 ➡ JSON 문자열
        body: JSON.stringify(data)
      }
      fetch('/api/cart', option)
        .then(response => response.json())
        .then(data => {
          console.log(data)
          printResult(data)
        })
        .catch(error => {
          console.error(error)
        })
    }
    // ==========================================
    // 장바구니 수정
    // PUT /api/cart
    // ==========================================
    function update() {
      const id = document.getElementById("updateId").value
      const quantity = document.getElementById("updateQuantity").value
      const data = {
        id: id,
        quantity: Number(quantity)
      }
      // PUT 옵션
      const option = {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          [csrfHeader]: csrfToken
        },
        body: JSON.stringify(data)
      }
      fetch('/api/cart', option)
        .then(response => response.json())
        .then(data => {
        console.log(data)
          printResult(data)
        })
        .catch(error => {
          console.error(error)
        })
    }
    // ==========================================
    // 장바구니 삭제
    // DELETE /api/cart/{id}
    // ==========================================
    function remove() {
      const id = document.getElementById("deleteId").value
      // DELETE 옵션
      const option = {
        method: 'DELETE',
        headers: {
          [csrfHeader]: csrfToken
        }
      }
      fetch(`/api/cart/${id}`, option)
        .then(response => response.text())
        .then(data => {
          console.log(data)
          printResult(data)
        })
        .catch(error => {
          console.error(error)
        })
    }
  </script>
</body>
</html>
