<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
  <title></title>
</head>
<body layout:fragment="content">
  <div class="auth-box">
    <h2 class="auth-title">로그인</h2>

    <!-- 메시지 -->
    <p class="flash" th:if="${message}" th:text="${message}"></p>
    <p class="err center" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="flash" th:if="${param.logout}">로그아웃 되었습니다.</p>

    <form th:action="@{/users/login}" method="post" class="form">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" name="username" autofocus placeholder="아이디를 입력하세요."> 
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호를 입력하세요."> 
      </div>
      <label class="check">
        <input type="checkbox" name="remember-me" id="rememberMe">
        <span>자동 로그인</span>
      </label>
      <button type="submit" class="btn-fill big">로그인</button>
    </form>
    <p class="auth-link">아직 회원이 아니신가요? <a th:href="@{/users/join}">회원가입</a></p>
  </div>
  
</body>
</html>
