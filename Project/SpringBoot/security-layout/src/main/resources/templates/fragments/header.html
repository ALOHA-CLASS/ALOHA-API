<th:block th:fragment="header">
  <div class="container">
    <header
      class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-md-3 mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <i class="bi bi-airplane-fill text-primary fs-1"></i>
        </a> 
      </div>
      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="/" class="nav-link px-2 link-secondary">홈</a></li>
        <li><a href="/board" class="nav-link px-2">게시판</a></li>
        <!-- 👮‍♀️관리자 -->
        <th:block sec:authorize="hasRole('ROLE_ADMIN')">
          <li><a href="/admin" class="nav-link px-2">관리자</a></li>
        </th:block>
      </ul>
      <div class="col-md-3 text-end"> 
        <!-- 비 로그인 시 -->
        <th:block sec:authorize="isAnonymous()">
          <a href="/login" class="btn btn-outline-primary me-2">로그인</a> 
          <a href="/join" type="button" class="btn btn-primary">회원가입</a> 
        </th:block>
        <!-- 로그인 시 -->
        <th:block sec:authorize="isAuthenticated()">
          <form action="/logout" method="post">
            <!-- CSRF TOKEN -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">로그아웃</button>
            </div>
          </form>
        </th:block>
      </div>
    </header>
  </div>
</th:block>
