
<!-- 페이지 프래그먼트 : page(Page 객체) -->
<th:block th:fragment="paging(page)">
  <!-- 페이지네이션 -->
  <nav class="paging" th:if="${page.totalPages > 0}">

    <!-- 처음 -->
    <a class="pg-btn"
      th:href="${url + '&page=0'}" >
      <span class="material-symbols-outlined">
        keyboard_double_arrow_left
      </span>
    </a>

    <!-- 이전 -->
    <a class="pg-btn"
       th:classappend="${page.first} ? 'disabled'"
       th:href="${url + '&page=' + (page.number - 1)}">
      <span class="material-symbols-outlined">
        chevron_left
      </span>
    </a>

    <!-- 페이지 번호 -->
    <span class="pg-nums">
      <th:block th:with="
        startPage=${(page.number / count) * count},
        endPage=${T(java.lang.Math).min(
          ((page.number / count) * count) + count - 1,
          page.totalPages - 1
        )}
      ">
          <th:block th:each="i : ${ #numbers.sequence(startPage, endPage) }">
            <a th:href="${url + '&page=' + i}"
               th:text="${i + 1}"
               class="pg-num"
               th:classappend="${i == page.number} ? 'on'"
               >1</a>
          </th:block>

      </th:block>
    </span>

    <!-- 다음 -->
    <a class="pg-btn"
       th:classappend="${page.last} ? 'disabled'"
       th:href="${url + '&page=' + (page.number + 1)}">
      <span class="material-symbols-outlined">
        chevron_right
      </span>
    </a>

    <!-- 마지막 -->
    <a class="pg-btn"
       th:href="${url + '&page=' + (page.totalPages - 1)}">
      <span class="material-symbols-outlined">
        keyboard_double_arrow_right
      </span>
    </a>

  </nav>
</th:block>
