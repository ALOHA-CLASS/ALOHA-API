<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
  <title>마이페이지</title>
</head>
<body layout:fragment="content">
  
  <div class="page-head">
    <h2 class="page-title">MY PAGE</h2>
    <p class="page-desc">
      <b sec:authentication="principal.name">사용자</b>님 환영합니다.
    </p>
  </div>

  <div class="mypage-grid">
    <a th:href="@{/orders}" class="mp-card">
      <span class="mp-ico">📦</span>
      <h3>주문내역</h3>
      <p>주문/배송 상태 확인</p>
    </a>
    
    <a th:href="@{/users/mypage/address}" class="mp-card">
      <span class="mp-ico">🏠</span>
      <h3>배송지 관리</h3>
      <p>배송지 등록/삭제</p>
    </a>

    <a th:href="@{/users/mypage/info}" class="mp-card">
      <span class="mp-ico">👤</span>
      <h3>회원정보 수정</h3>
      <p>이름/이메일/비밀번호 수정</p>
    </a>

    <form th:action="@{/users/logout}" method="post" class="mp-card logout">
      <button type="submit">
        <span class="mp-ico">🔓</span>
        <h3>로그아웃</h3>
        <p>안전하게 로그아웃</p>
      </button>
    </form>

  </div>
</body>
</html>
